<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Online - SweetSlice</title>
  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f3ebed;
      margin: 0;
      padding: 0;
    }

    header {
      background: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: #858181;
    }

    .active {
      color: black;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .order-form {
      background: white;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: auto;
    }

    .order-form label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    .order-form input,
    .order-form textarea,
    .order-form select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .order-form button {
      margin-top: 15px;
      background: #f3d6cc;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    footer {
      text-align: center;
      background: #f3d6cc;
      color: #5a3e36;
      padding: 15px;
      border-radius: 6px;
      margin-top: 40px;
      font-size: 14px;
    }
   .info {
  text-align: center;
  padding: 15px;
  background: #fff0f0;
  margin-top: 20px;
}

.info a {
  color: #d14b8f;
  text-decoration: none;
  font-weight: bold;
}



  </style>
</head>

<body>

  <header>
    <div class="logo">SweetSlice</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="orderonline.html" class="active">OrderOnline</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Order Online</h1>
    <div class="order-form">
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your full name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your email address">

        <label for="cake">Select Cake:</label>
        <select id="cake" name="cake">
          <option>Chocolate Cake</option>
          <option>Vanilla Cake</option>
          <option>Special Designer Cake</option>
        </select>

        <label for="message">Message / Customization:</label>
        <textarea id="message" name="message" rows="4" placeholder="Any special requests"></textarea>

        <button type="submit">Place Order</button>
      </form>
       </div>
      <!-- 1. Location, Timing & WhatsApp -->
<section class="info">
  
  <p>📞 <a href="https://wa.me/923001234567">WhatsApp: 0300-1234567</a></p>
</section>
    
  </main>
 
  <footer>
    <p>© 2025 by Amna Bakes - All rights reserved.</p>
    
  </footer>

</body>

</html>
