<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - SweetSlice</title>
  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f3ebed;
      margin: 0;
      padding: 0;
    }

    header {
      background: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: #858181;
    }

    .active {
      color: black;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .contact-form {
      background: white;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: auto;
    }

    .contact-form label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .contact-form button {
      margin-top: 15px;
      background: #f3d6cc;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    footer {
      text-align: center;
      background: #f3d6cc;
      color: #5a3e36;
      padding: 15px;
      border-radius: 6px;
      margin-top: 40px;
      font-size: 14px;
    }
    .info {
  text-align: center;
  padding: 10px;
  background: #fff0f0;
  margin-top: 20px;
  max-width: 100%; 
  
}

.info a {
  color: #d14b8f;
  text-decoration: none;
  font-weight: bold;
}
.social {
  text-align: center;
  padding: 15px;
  background: #fff0f0;
  margin-top: 20px;
}
.social a {
  margin: 0 8px;
  color: #333;
  text-decoration: none;
  font-weight: 600;
}

.social a:hover {
  color: #d14b8f;
}

  </style>
</head>

<body>

  <header>
    <div class="logo">SweetSlice</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="orderonline.html">OrderOnline</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <div class="contact-form">
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your email">

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" placeholder="Your message"></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
    <section class="info">
  <p>📍 Main Road, City Center</p>
  <p>⏰ Open: 9 AM – 10 PM</p>
  <p>📞 <a href="https://wa.me/923001234567">WhatsApp: 0300-1234567</a></p>
</section>
  <div class="social">
  <a href="#">Facebook</a> |
  <a href="#">Instagram</a> |
  <a href="#">Twitter</a>
  </main>


  <footer>
    <p>© 2025 by Amna Bakes - All rights reserved.</p>
  </footer>

</body>

</html>
